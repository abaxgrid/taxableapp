<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

<style>
/* One phone-width app column. Same Taxable look as the expat prototype: green ink, one teal accent, amber/rose only for state. */
:root{
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#0F2B2A; --muted:#51615E; --line:#DCE3E1;
  --accent:#0B7A75; --accent-fg:#FFFFFF; --accent-soft:#E6F3F1; --accent-text:#075C58;
  --warn-bg:#FFF1D6; --warn-line:#F0D79B; --warn-fg:#5E3A00; --warn-bar:#D18A00;
  --danger-bg:#FDECEA; --danger-line:#F3C5C0; --danger-fg:#6E1A12; --danger-bar:#C0392B;
  --info-bg:#E8EEF9; --info-fg:#1F3F7A; --neutral-bg:#EEF1F0; --neutral-fg:#3E4E4B;
  --hero-bg:#0F2B2A; --hero-fg:#FFFFFF; --hero-muted:#B9D6D2; --shadow:0 10px 40px rgba(15,43,42,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1716; --surface:#142423; --ink:#E8F1EF; --muted:#9FB4B0; --line:#2A3F3D;
    --accent:#3FB8AD; --accent-fg:#06201E; --accent-soft:#1C3836; --accent-text:#7FD6CD;
    --warn-bg:#3A2D12; --warn-line:#5C4617; --warn-fg:#F2D49A; --warn-bar:#E0A63A;
    --danger-bg:#3C1B18; --danger-line:#6A2B26; --danger-fg:#F5BDB6; --danger-bar:#E0675A;
    --info-bg:#1B2A45; --info-fg:#B6CCF2; --neutral-bg:#1E2F2D; --neutral-fg:#B7C9C5;
    --hero-bg:#1C3836; --hero-fg:#E8F1EF; --hero-muted:#A9C4C0; --shadow:0 10px 40px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1716; --surface:#142423; --ink:#E8F1EF; --muted:#9FB4B0; --line:#2A3F3D;
  --accent:#3FB8AD; --accent-fg:#06201E; --accent-soft:#1C3836; --accent-text:#7FD6CD;
  --warn-bg:#3A2D12; --warn-line:#5C4617; --warn-fg:#F2D49A; --warn-bar:#E0A63A;
  --danger-bg:#3C1B18; --danger-line:#6A2B26; --danger-fg:#F5BDB6; --danger-bar:#E0675A;
  --info-bg:#1B2A45; --info-fg:#B6CCF2; --neutral-bg:#1E2F2D; --neutral-fg:#B7C9C5;
  --hero-bg:#1C3836; --hero-fg:#E8F1EF; --hero-muted:#A9C4C0; --shadow:0 10px 40px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:16px;margin:0}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:420px;min-height:780px;margin-inline:auto;display:flex;flex-direction:column;gap:20px;padding-block:8px 16px}
@media (min-width:560px){.app{border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:24px;margin-block:16px}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.iconbtn{width:44px;height:44px;margin-left:-10px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.linkbtn{min-height:44px;border:0;background:transparent;color:var(--accent-text);font-size:14px;font-weight:700;cursor:pointer;padding:0 4px}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s}
.eyebrow{font-size:13px;font-weight:700;color:var(--accent-text);letter-spacing:.04em;text-transform:uppercase}
.badge{align-self:flex-start;background:var(--accent-soft);color:var(--accent-text);font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px}
h1{margin:0;font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
h1.big{font-size:34px;line-height:1.1;letter-spacing:-.03em}
h2{margin:0;font-size:18px;font-weight:800}
h3{margin:0;font-size:15px;font-weight:800}
p{margin:0}
.lead{font-size:15px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex-grow:1}
.persona{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px;cursor:pointer}
.persona b{font-size:18px;font-weight:800}
.persona span{font-size:14px;color:var(--muted)}
.persona:hover{border-color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;min-height:56px;padding:12px 18px;background:var(--surface);border:2px solid var(--line);border-radius:14px;font-size:16px;font-weight:600;cursor:pointer}
.opt input{width:20px;height:20px;margin:0;accent-color:var(--accent);flex-shrink:0}
.opt.sel{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.btn{min-height:56px;border:0;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer;padding:0 20px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.primary[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:48px;font-size:15px}
.btn.line{background:transparent;border:2px solid var(--accent);color:var(--accent-text)}
.btn.ghost{min-height:44px;background:transparent;color:var(--accent-text);font-size:15px;font-weight:600}
.actions{display:flex;flex-direction:column;gap:6px}
.fine{font-size:13px;color:var(--muted);text-align:center}
.hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.hero .k{font-size:13px;font-weight:600;color:var(--hero-muted)}
.hero .v{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.hero .n{font-size:13px;color:var(--hero-muted)}
.hero .two{display:flex;gap:20px;border-top:1px solid rgba(255,255,255,.18);padding-top:12px}
.hero .two div{display:flex;flex-direction:column;gap:2px}
.hero .two b{font-size:17px;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.row .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.row .t b{font-size:15px}
.row .t span{font-size:13px;color:var(--muted)}
.row .amt{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;flex-shrink:0}
.chip{flex-shrink:0;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent-text)}
.chip.warn{background:var(--warn-bg);color:var(--warn-fg)}
.chip.neutral{background:var(--neutral-bg);color:var(--neutral-fg)}
.chip.info{background:var(--info-bg);color:var(--info-fg)}
.flag{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.flag b{font-size:15px;font-weight:800}
.flag span{font-size:14px}
.flag.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-fg)}
.flag.danger{background:var(--danger-bg);border:1px solid var(--danger-line);color:var(--danger-fg)}
.flag.info{background:var(--info-bg);color:var(--info-fg)}
.soft{background:var(--neutral-bg);color:var(--neutral-fg);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.5}
.meter{display:flex;flex-direction:column;gap:8px}
.meter .head{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:700}
.meter .head span:last-child{font-variant-numeric:tabular-nums}
.track{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.track>i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.track.warn>i{background:var(--warn-bar)}
.track.danger>i{background:var(--danger-bar)}
.meter .st{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.nav{position:sticky;bottom:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px;margin-top:auto;box-shadow:var(--shadow)}
.nav button{min-height:56px;border:0;border-radius:14px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;cursor:pointer;padding:0;min-width:0}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.field input{min-height:52px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:16px;padding:0 14px;width:100%;min-width:0}
.field input:focus{border-color:var(--accent);outline:none}
.err{font-size:13px;font-weight:600;color:var(--danger-fg)}
.date{width:48px;flex-shrink:0;text-align:center;display:flex;flex-direction:column}
.date span{font-size:12px;font-weight:700;color:var(--muted)}
.date b{font-size:24px;font-weight:800;line-height:1}
.dcheck{width:24px;height:24px;accent-color:var(--accent);flex-shrink:0;margin:0}
.cat{display:flex;flex-direction:column;gap:6px;font-size:13px}
.cat .line{display:flex;justify-content:space-between;gap:12px;font-weight:700}
.cat .line span:last-child{font-variant-numeric:tabular-nums}
.fl{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',system-ui,sans-serif;font-size:26px;line-height:1;flex-shrink:0}
.pick{width:100%;text-align:left;cursor:pointer;gap:12px;font-family:inherit;color:var(--ink)}
.pick .t{flex-grow:1}
.flags{display:flex;align-items:center;gap:12px;font-size:20px}
.ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.top{flex-wrap:wrap}
.topr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.lang{display:flex;gap:4px;background:var(--neutral-bg);border-radius:12px;padding:3px}
.lang button{min-height:40px;min-width:44px;padding:0 8px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,43,42,.15)}
.lang .fl{font-size:18px}
.ftabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:2px solid var(--line)}
.ftabs button{padding:0 4px;min-height:48px;line-height:1.15;font-size:13px;border:0;background:transparent;color:var(--muted);font-weight:700;cursor:pointer;border-bottom:4px solid transparent}
.ftabs button[aria-pressed="true"]{color:var(--accent-text);border-bottom-color:var(--accent)}
details.us summary{font-size:18px;font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center}
.secbar{grid-template-columns:repeat(4,minmax(0,1fr))}
.toolrow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-top:-4px;scrollbar-width:thin}
.toolrow .fchip{flex-shrink:0;min-height:40px;padding:0 14px;font-size:13px}
.toolrow .pin{border-style:dashed}
.tcard .thead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tcard .btn{align-self:flex-start}
.pfq{display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600}
.srch{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.srch b{font-size:15px}.srch span{font-size:13px;color:var(--muted)}
.sech{margin-top:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--neutral-bg);border-radius:14px;padding:4px}
.seg button{min-height:48px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-size:16px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,43,42,.15)}
.check{display:flex;align-items:flex-start;gap:12px;font-size:14px;line-height:1.45;cursor:pointer}
.check input{width:24px;height:24px;margin:0;accent-color:var(--accent);flex-shrink:0}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Responsive: tablet and desktop ----------
   Phones keep the single app column above. Wider screens use the room:
   a wider column on tablets, and a two-column board on desktops where
   cards sit side by side, lists become grids and the tab bar floats centered. */
h1[tabindex="-1"]:focus{outline:none}
@media (min-width:760px){
  body{padding-inline:24px}
  .app{max-width:760px;min-height:0}
  .lead{max-width:72ch}
  .app>p.fine{max-width:72ch;margin-inline:auto}
  .seg{max-width:560px}
  .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .card:has(>.field+.field){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:end}
  .card:has(>.field+.field)>:not(.field){grid-column:1/-1}
  .stack:has(>.persona+.persona){display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:1100px){
  body{padding-inline:32px}
  .app{max-width:1200px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 28px;align-content:start;align-items:start;padding:32px 40px}
  .app>*{grid-column:1/-1;min-width:0}
  .app>.card,.app>.hero,.app>.flag,.app>details.card,.app>.soft,.app>.stack[aria-live]{grid-column:auto}
  .app>.stack:has(>.card+.card),.app>.stack:has(>.tcard+.tcard),.app>.stack:has(>.row+.row),.app>.stack:has(>.srch+.srch){display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-items:stretch}
  .app>.stack>.tcard .btn{margin-top:auto}
  .app>.card:has(input[type=search]){grid-column:1/-1}
  .app>.card:has(+.stack[aria-live]){position:sticky;top:16px}
  .stack:has(>.persona+.persona){grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .opts{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .app>.card:has(>.field+.field){grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .ftabs{max-width:720px}
  .nav{width:100%;max-width:640px;justify-self:center;bottom:16px}
  .hero .v{font-size:40px}
  h1.big{font-size:42px}
}
</style>

        out = '<div class="flag info"><b>Probablemente no debe declarar renta</b><span>Con ingresos brutos de hasta $11,000 no paga ISR. Declare solo si quiere pedir una devolución por retenciones.</span></div>';
      } else {
        out = '<div class="hero"><span class="k">Ahorro posible en renta (ilustrativo)</span><span class="v">' + m(save) + '</span>' +
          '<span class="n">Con ' + m(ded) + ' en gastos deducibles registrados. ' + (s.extra === 'yes' ? 'Como su empleador le retiene, podría llegar como devolución.' : 'Se refleja al declarar.') + '</span>' +
          '<div class="two"><div><span class="k">ISR sin deducciones</span><b>' + m(base) + '</b></div><div><span class="k">ISR con deducciones</span><b>' + m(after) + '</b></div></div></div>';
      }
      var cats = ['med', 'hip', 'edu', 'don'].map(function (c) {
        var tot = s.inv.reduce(function (a, i) { return a + (i.cat === c && status(i) === 'ded' ? i.amt : 0); }, 0);
        return '<div class="cat"><div class="line"><span>' + CAT[c].n + '</span><span>' + m2(tot) + '</span></div></div>';
      }).join('');
      var rev = s.inv.filter(function (i) { return status(i) === 'rev'; }).length;
      out += '<div class="card"><h2>Gastos deducibles por categoría</h2>' + cats +
        '<p class="fine" style="text-align:left">Cuenta solo facturas con RUC del proveedor. Límites por categoría: [POR VERIFICAR].</p></div>';
      if (rev) out += '<div class="flag warn"><b>' + rev + (rev === 1 ? ' factura por revisar' : ' facturas por revisar') + '</b><span>Falta el RUC o hay que confirmar que se pueda deducir.</span><button type="button" class="linkbtn" style="align-self:flex-start;padding:0" data-tab="inv">Revisar ahora</button></div>';
    } else {
      var rv = s.rev, dc = s.docs, over = rv >= CAP_REV || dc >= CAP_DOCS, near = rv >= CAP_REV * 0.8 || dc >= CAP_DOCS * 0.8;
      if (s.extra === 'free') {
        out = '<div class="card"><h2>Límite del facturador gratuito</h2>' + meter('Ingresos brutos del año', rv, CAP_REV, m) + meter('Documentos este mes', dc, CAP_DOCS, String) +
          '<button type="button" class="btn line sm" data-act="sale">Simular una venta de $250</button></div>';
        if (over) out += '<div class="flag danger"><b>Superó el límite del facturador gratuito</b><span>Debe pasar a un PAC (proveedor autorizado) o a un sistema propio certificado por la DGI. Necesitará firma electrónica calificada.</span></div>';
        else if (near) out += '<div class="flag warn"><b>Se acerca al límite</b><span>Cambiar de sistema toma tiempo. Compare PAC y consiga su firma electrónica calificada antes de llegar a $36,000 o 100 documentos al mes.</span></div>';
      } else if (s.extra === 'pac') {
        out = '<div class="flag info"><b>El límite del facturador gratuito no le aplica</b><span>Usted ya factura con un PAC o sistema propio. Aquí controlamos sus fechas y sus gastos deducibles.</span></div>';
      } else {
        out = '<div class="flag info"><b>Empiece con el facturador gratuito</b><span>Si sus ingresos brutos son de hasta $36,000 al año y emite hasta 100 documentos al mes, puede usar el facturador de la DGI con una declaración jurada. Más allá, necesitará un PAC.</span></div>';
      }
      out += '<div class="card"><h2>Renta estimada (ilustrativo)</h2><p class="lead">Sobre un ingreso neto de ' + m(mi) + ': <b style="color:var(--ink)">' + m(isr(mi)) + '</b> de ISR. Los independientes deben declarar aunque su ingreso sea bajo.</p></div>';
      out += '<div class="card"><h2>Haga esto primero</h2><ul class="plain"><li>Confirme su RUC y su registro de ITBMS.</li><li>Guarde cada factura de gasto con el RUC del proveedor.</li><li>Fije un recordatorio mensual para su declaración de ITBMS.</li></ul></div>';
    }
    return top(false, '', '<button type="button" class="linkbtn" data-act="restart">Cambiar perfil</button>') + head + out +
      moreCards() +
      '<p class="fine">Guía, no asesoría fiscal. Reglas verificadas por última vez el [FECHA].</p>' + nav();
  }

  function invoices() {
    var f = s.filter;
    var list = s.inv.filter(function (i) { return f === 'all' || status(i) === f; });
    var stc = { ded: ['Deducible', 'accent'], rev: ['Por revisar', 'warn'], no: ['No deducible', 'neutral'] };
    var rows = list.map(function (i) {
      var st = status(i), why = !i.ruc ? 'Falta el RUC del proveedor' : CAT[i.cat].n;
      return '<div class="row"><div class="t"><b>' + esc(i.p) + '</b><span>' + why + '</span></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><span class="amt">' + m2(i.amt) + '</span><span class="chip ' + stc[st][1] + '">' + stc[st][0] + '</span></div></div>';
    }).join('') || '<p class="lead">No hay facturas en esta vista.</p>';

      '<div class="stack" style="gap:6px"><h1 id="h">Facturas y gastos</h1><p class="lead">Total deducible registrado: <b style="color:var(--ink)">' + m2(dedTotal()) + '</b></p></div>' +
      '<button type="button" class="btn primary" data-go="add">Agregar factura</button>' +
      '<div class="chips" role="group" aria-label="Filtrar facturas">' + fc('all', 'Todas') + fc('ded', 'Deducibles') + fc('rev', 'Por revisar') + '</div>' +

  }

  function calendar() {
    var items = [
      { m: 'MAR', d: '15', t: 'Declaración y pago del impuesto sobre la renta (si le corresponde)', tag: 'Renta', k: 'isr' },
      { m: 'ABR', d: '15', t: 'Fin de la prórroga para presentar. El pago sigue siendo el 15 de marzo.', tag: 'Renta', k: 'pro' }
    ];
    if (s.persona === 'emp') {
      items.unshift({ m: 'CADA', d: 'MES', t: 'Declaración de ITBMS', tag: 'ITBMS', k: 'itbms', pend: '[DÍA POR VERIFICAR]' });
      if (s.extra === 'free') items.splice(1, 0, { m: 'CADA', d: 'MES', t: 'Revise cuántos documentos emitió (máximo 100 en el facturador gratuito)', tag: 'DGI', k: 'docs' });
    }
    var rows = items.map(function (i) {
      var dn = !!s.done[i.k];
      return '<div class="row" style="' + (dn ? 'opacity:.6' : '') + '"><div class="date"><span>' + i.m + '</span><b' + (i.d.length > 2 ? ' style="font-size:16px;padding-top:6px"' : '') + '>' + i.d + '</b></div>' +
        '<div class="t" style="flex-grow:1;gap:6px"><b>' + i.t + '</b><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="chip info">' + i.tag + '</span><span class="chip warn">' + (i.pend || 'Fecha por verificar') + '</span></div></div>' +
        '<input class="dcheck" type="checkbox" data-done="' + i.k + '"' + (dn ? ' checked' : '') + ' aria-label="Marcar como hecho: ' + esc(i.t) + '"></div>';
    }).join('');
    return top(false, '', '<button type="button" class="linkbtn" data-act="restart">Cambiar perfil</button>') +
      '<div class="stack" style="gap:6px"><h1 id="h">Sus fechas</h1><p class="lead">Solo las que le aplican según su perfil.</p></div>' +
      '<div class="stack">' + rows + '</div>' +
      '<div class="soft">Le avisaremos 7 días y 1 día antes de cada fecha. Las fechas son ejemplos y se verifican con fuentes oficiales antes del lanzamiento.</div>' + nav();
  }

  function pros() {
    var tags = [['Renta de personas naturales', 'Devoluciones'], ['ITBMS y emprendedores', 'Cambio a PAC'], ['Renta y ITBMS', 'Cuentas por cobrar']];
    var cards = [0, 1, 2].map(function (i) {
      var sent = s.req[i];
      return '<div class="card"><div style="display:flex;align-items:center;gap:12px"><div style="width:44px;height:44px;border-radius:12px;background:var(--neutral-bg);color:var(--muted);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">FOTO</div>' +
        '<div style="min-width:0"><h3>[CONTADOR/A ' + (i + 1) + ']</h3><span style="font-size:13px;color:var(--muted)">Contador público autorizado · Idoneidad [N.°]</span></div></div>' +
        '<div class="chips"><span class="chip accent">' + tags[i][0] + '</span><span class="chip neutral">' + tags[i][1] + '</span></div>' +
        '<div style="font-size:14px;display:flex;justify-content:space-between;gap:12px"><span style="color:var(--muted)">Desde</span><b>$[PRECIO]</b></div>' +
        (sent ? '<div class="flag info"><b>Solicitud enviada (prototipo)</b><span>En la app real, el contador respondería en [PLAZO]. No se envió nada.</span></div>' :
          '<button type="button" class="btn primary sm" data-req="' + i + '">Solicitar cotización</button>') + '</div>';
    }).join('');
    return top(false, '', '<button type="button" class="linkbtn" data-act="restart">Cambiar perfil</button>') +
      '<div class="stack" style="gap:6px"><h1 id="h">Contadores</h1><p class="lead">Profesionales que presentan su renta y su ITBMS por usted.</p></div>' +
      '<div class="stack">' + cards + '</div>' +
      '<div class="flag warn"><b>Divulgación de comisión</b><span>Taxable puede recibir una comisión por referencia si usted contrata a un contador. Cada profesional le cotiza antes de que usted decida. [TEXTO FINAL POR REVISAR CON ASESOR LEGAL]</span></div>' + nav();
  }

  /* ---------- Real estate ---------- */
  function num(x) { return parseFloat(x) || 0; }
  /* ITBI: 2% of the higher of price and registered value. New home, first sale (Law 546 of 2026): first $120,000 exempt, reduced rates up to $200,000. */
  function itbi(base, nf) {
    if (!nf) return 0.02 * base;
    if (base <= 120000) return 0;
    if (base > 200000) return 0.02 * (base - 120000);
    var r = base <= 130000 ? 0.005 : (base <= 150000 ? 0.01 : (base <= 170000 ? 0.014 : (base <= 190000 ? 0.016 : 0.018)));
    return r * (base - 120000);
  }
  function propTax(v, main) {
    var br = main ? [[120000, 0], [700000, 0.005], [Infinity, 0.007]] : [[30000, 0], [250000, 0.006], [500000, 0.008], [Infinity, 0.01]];
    var tax = 0, lo = 0;
    br.forEach(function (b) { if (v > lo) tax += (Math.min(v, b[0]) - lo) * b[1]; lo = b[0]; });
    return tax;
  }
  function rrow(t, sub, amt, chip) {
    return '<div class="row"><div class="t"><b>' + t + '</b><span>' + sub + '</span></div>' +
      (chip ? '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><span class="amt">' + amt + '</span>' + chip + '</div>' : '<span class="amt">' + amt + '</span>') + '</div>';
  }
  function rflag(k, t, b) { return '<div class="flag ' + k + '"><b>' + t + '</b><span>' + b + '</span></div>'; }

  function reOut() {
    var r = s.re, price = num(r.price), cad = num(r.cad), base = Math.max(price, cad);
    if (!(price > 0)) return '<p class="lead">Escriba el precio para ver el cálculo.</p>';
    var it = itbi(base, r.newFirst), out = '', unclear = r.newFirst && base > 200000;
    var newNote = unclear ? rflag('warn', 'ITBI en vivienda nueva de más de $200,000', 'El texto de la ley no aclara cómo se grava el exceso. Mostramos una estimación conservadora: 2% sobre lo que pasa de $120,000.') : '';
    if (r.mode === 'sell') {
      var cost = num(r.cost), gain = Math.max(0, price - cost), adv = 0.03 * base, t10 = 0.10 * gain, fin = Math.min(adv, t10), refund = adv - fin;
      out = '<div class="hero"><span class="k">Impuestos estimados de la venta (ilustrativo)</span><span class="v">' + m(it + fin) + '</span>' +
        '<span class="n">ITBI más el menor de dos cálculos de ganancia de capital.</span>' +
        '<div class="two"><div><span class="k">Se paga al firmar</span><b>' + m(it + adv) + '</b></div><div><span class="k">Devolución posible</span><b>' + m(refund) + '</b></div></div></div>' +
        '<div class="stack">' +
        rrow('ITBI (lo paga el vendedor)', r.newFirst ? 'Vivienda nueva, primera venta' : '2% del mayor entre el precio y el valor registrado', m(it)) +
        rrow('Ganancia de capital · opción A', '3% definitivo, sobre ' + m(base), m(adv), adv <= t10 ? '<span class="chip accent">Menor</span>' : '') +
        rrow('Ganancia de capital · opción B', '10% de la ganancia real de ' + m(gain), m(t10), t10 < adv ? '<span class="chip accent">Menor</span>' : '') +
        '</div>' + newNote +
        rflag('info', 'Con la opción B, el 3% se toma como adelanto', 'Se paga el 3% al firmar y luego se reclama el exceso sobre el 10% de la ganancia real. Un contador debe presentar ese cálculo.') +
        rflag('warn', 'Vivienda principal: por verificar', 'Las fuentes no coinciden sobre si la venta de la vivienda principal tiene alivio de ganancia de capital. No lo aplicamos. Confirme con un contador.') +
        '<div class="soft">Si vender inmuebles es su actividad principal, la ganancia se grava a 25%. No incluye comisión del corredor, honorarios, Registro Público ni notaría.</div>';
    } else {
      var val = cad > 0 ? cad : price, ann = propTax(val, r.main);
      out = '<div class="hero"><span class="k">Impuesto de inmuebles al año (estimado)</span><span class="v">' + m(ann) + '</span>' +
        '<span class="n">Sobre un valor registrado de ' + m(val) + ' · ' + (r.main ? 'vivienda principal' : 'otra propiedad') + '.</span></div>' +
        '<div class="stack">' +
        rrow('ITBI (lo paga el vendedor)', r.newFirst ? 'Vivienda nueva, primera venta' : 'Es un costo del vendedor; conviene saberlo al negociar', m(it)) +
        rrow('Registro Público', 'Derechos de inscripción', '[POR VERIFICAR]') +
        rrow('Notaría', 'Escritura pública', '[POR VERIFICAR]') +
        rrow('ITBMS en obra nueva', 'Si compra al promotor', '[POR VERIFICAR]') +
        '</div>' + newNote +
        rflag('warn', 'Obra nueva: la exoneración del impuesto de inmuebles varía', 'En construcciones nuevas la exoneración cubre las mejoras, no el terreno, y depende del valor y de la fecha del permiso de construcción. Pida al promotor el detalle por escrito.') +
        '<div class="card"><h2>Antes de firmar</h2><ul class="plain">' +
          '<li>Pida el certificado del Registro Público de la finca.</li>' +
          '<li>Pida el NIT de la finca a la DGI y revise si tiene deudas. Las deudas siguen al inmueble, no a la persona.</li>' +
          '<li>Revise el valor registrado en ANATI: el ITBI y el impuesto anual se calculan sobre él.</li>' +
          (r.newFirst ? '<li>Confirme la fecha del permiso de ocupación: la exoneración exige firmar dentro de 2 años.</li>' : '') +
        '</ul></div>';
    }
    return out;
  }

  /* ---------- Treaties ---------- */
  /* Treaty list, in-force dates and MLI withholding effects: DGI Panama (17 in force; Austria, Bahrain, Belgium negotiated, unsigned). */
  var COUNTRIES = [
    ['BB', 'Barbados', 'treaty', '18/2/2011', '1/1/2022'], ['KR', 'Corea del Sur', 'treaty', '1/4/2012', '1/1/2022'],
    ['AE', 'Emiratos Árabes Unidos', 'treaty', '23/10/2013', '1/1/2022'], ['ES', 'España', 'treaty', '25/7/2011', '1/1/2023'],
    ['FR', 'Francia', 'treaty', '1/2/2012', '1/1/2022'], ['NL', 'Países Bajos', 'treaty', '1/12/2011', '1/1/2022'],
    ['IE', 'Irlanda', 'treaty', '19/12/2012', null], ['IL', 'Israel', 'treaty', '30/6/2014', '1/1/2022'],
    ['IT', 'Italia', 'treaty', '1/6/2017', 'nocub'], ['LU', 'Luxemburgo', 'treaty', '1/11/2011', '1/1/2022'],
    ['MX', 'México', 'treaty', '30/12/2010', '1/1/2024'], ['PT', 'Portugal', 'treaty', '10/6/2012', '1/1/2022'],
    ['QA', 'Catar', 'treaty', '6/5/2011', '1/1/2022'], ['GB', 'Reino Unido', 'treaty', '13/12/2013', '1/1/2022'],
    ['CZ', 'República Checa', 'treaty', '25/2/2013', '1/1/2025'], ['SG', 'Singapur', 'treaty', '19/12/2011', '1/1/2025'],
    ['VN', 'Vietnam', 'treaty', '14/2/2017', '1/1/2024'],
    ['AT', 'Austria', 'neg'], ['BH', 'Baréin', 'neg'], ['BE', 'Bélgica', 'neg'],
    ['US', 'Estados Unidos', 'none'], ['CO', 'Colombia', 'none'], ['VE', 'Venezuela', 'none'], ['CR', 'Costa Rica', 'none'],
    ['BR', 'Brasil', 'none'], ['DE', 'Alemania', 'none'], ['CA', 'Canadá', 'none'], ['CN', 'China', 'none'],
    ['AR', 'Argentina', 'none'], ['CL', 'Chile', 'none'], ['PE', 'Perú', 'none'], ['EC', 'Ecuador', 'none'],
    ['CH', 'Suiza', 'none'], ['JP', 'Japón', 'none'], ['XX', 'Otro país', 'none']
  ];
  var INC = {
    div: ['Dividendos', 'Los tratados suelen fijar una tasa máxima de retención en la fuente, a veces menor si usted tiene una participación importante.', '10%'],
    int: ['Intereses', 'Los tratados suelen reducir o eliminar la retención sobre intereses.', '12.5%'],
    roy: ['Regalías', 'Los tratados suelen reducir la retención sobre regalías.', '12.5%'],
    serv: ['Servicios o actividad empresarial', 'Las ganancias empresariales se gravan normalmente en el país de residencia, salvo que exista un establecimiento permanente en el otro país.', null],
    sal: ['Salario', 'El salario se grava normalmente donde se trabaja. Muchos tratados lo dejan solo en el país de residencia si la estadía es de menos de 183 días y el empleador está fuera.', null],
    inm: ['Ganancia por venta de inmuebles', 'La ganancia por vender un inmueble se grava normalmente en el país donde está el inmueble.', null]
  };
  var TR_STEPS = ['dir', 'country', 'income', 'who', 'crf'];
  var STC = { treaty: ['Tratado vigente', 'accent'], neg: ['En negociación', 'warn'], none: ['Sin tratado', 'neutral'] };
  function cflag(code) {
    if (code === 'XX') return '🌐';
    return String.fromCodePoint(0x1F1E6 + code.charCodeAt(0) - 65, 0x1F1E6 + code.charCodeAt(1) - 65);
  }
  function norm(x) { return x.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function cget(code) { return COUNTRIES.filter(function (c) { return c[0] === code; })[0]; }

  function trList(mode) {
    var q = norm((mode === 'rm' ? s.rm.q : s.tr.q).trim()), html = '';
    [['treaty', 'Con tratado vigente'], ['neg', 'En negociación, sin firma'], ['none', 'Sin tratado']].forEach(function (g) {
      var items = COUNTRIES.filter(function (c) { return c[2] === g[0] && norm(c[1]).indexOf(q) !== -1; });
      if (!items.length) return;
      html += '<h3 style="padding-top:6px">' + g[1] + '</h3>' + items.map(function (c) {
        var st = STC[c[2]];
        return '<button type="button" class="row pick" data-' + (mode === 'rm' ? 'rmcountry' : 'country') + '="' + c[0] + '"><span class="fl" aria-hidden="true">' + cflag(c[0]) + '</span><div class="t"><b>' + c[1] + '</b></div><span class="chip ' + st[1] + '">' + st[0] + '</span></button>';
      }).join('');
    });
    return html || '<p class="lead">Ningún país coincide. Pruebe con otro nombre o elija "Otro país".</p>';
  }

  function trQ(key) {
    var out = s.tr.dir === 'out';
    if (key === 'dir') return { q: '¿Cuál es su caso?', hint: 'Esto define quién retiene el impuesto y qué certificado necesita.',
      opts: [['out', 'Resido o tengo mi empresa en Panamá y recibo ingresos de otro país'], ['in', 'Resido o tengo mi empresa en otro país y recibo ingresos de Panamá']] };
    if (key === 'income') return { q: '¿Qué tipo de ingreso es?', hint: 'El alivio cambia según el tipo de ingreso.',
      opts: Object.keys(INC).map(function (k) { return [k, INC[k][0]]; }) };
    if (key === 'who') return { q: '¿Es una persona natural o una empresa?', hint: 'Los documentos para probar la residencia son distintos.',
      opts: [['pn', 'Persona natural'], ['pj', 'Empresa o sociedad']] };
    return { q: out ? '¿Ya tiene el certificado de residencia fiscal de Panamá?' : '¿Tiene un certificado de residencia fiscal de su país?',
      hint: 'Sin este certificado normalmente no se puede aplicar el tratado.',
      opts: [['yes', 'Sí, lo tengo'], ['no', 'No, todavía no'], ['ns', 'No estoy seguro']] };
  }

  function trBody() {
    var t = s.tr, n = TR_STEPS.length;
    if (t.step >= n) return trResult();
    var key = TR_STEPS[t.step], pct = Math.round((t.step + 1) / (n + 1) * 100);
    var head = '<div class="stack" style="gap:10px"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span class="eyebrow">Alivio por tratados · ' + (t.step + 1) + ' de ' + n + '</span>' +
      (t.step > 0 ? '<button type="button" class="linkbtn" data-tr="back">Atrás</button>' : '') + '</div></div>';
    if (key === 'country') {
      var hint = t.dir === 'out' ? 'Elija el país de donde vienen sus ingresos.' : 'Elija el país donde usted es residente fiscal.';
      return head + '<div class="stack" style="gap:6px"><h1 id="h">¿Con qué país?</h1><p class="lead">' + hint + '</p></div>' +
        '<label class="field" for="tr-q">Buscar país<input id="tr-q" type="search" autocomplete="off" value="' + esc(t.q) + '" placeholder="Escriba el nombre"></label>' +
        '<div class="stack" id="tr-list" aria-live="polite">' + trList() + '</div>';
    }
    var d = trQ(key), cur = t[key];
    var opts = d.opts.map(function (o) {
      return '<label class="opt' + (cur === o[0] ? ' sel' : '') + '"><input type="radio" name="tropt" value="' + o[0] + '"' + (cur === o[0] ? ' checked' : '') + '>' + o[1] + '</label>';
    }).join('');
    var c = t.country ? cget(t.country) : null;
    return head + '<div class="stack" style="gap:6px"><h1 id="h">' + d.q + '</h1><p class="lead">' + d.hint + '</p>' +
      (c ? '<span class="chip neutral" style="align-self:flex-start"><span class="fl" style="font-size:16px" aria-hidden="true">' + cflag(c[0]) + '</span> ' + c[1] + '</span>' : '') + '</div>' +
      '<div class="opts" role="radiogroup" aria-labelledby="h">' + opts + '</div>' +
      '<button type="button" class="btn primary" id="trnext" data-tr="next"' + (cur ? '' : ' disabled') + '>' + (t.step === n - 1 ? 'Ver resultado' : 'Continuar') + '</button>';

  /* ---------- Developers (Tax Code art. 701) ---------- */
  /* Route A, ordinary course of business: new homes and commercial premises (first sale, within 2 years of occupancy permit, construction permit from 2010) pay a special rate on the higher of price and cadastral value: homes to $35,000 0.5%, $35,000-$80,000 1.5%, above $80,000 2.5%, commercial 4.5%. Otherwise 25% of the net gain. Route B, capital gains: 10% of the real gain with a 3% advance on the higher of price and cadastral value. */
  var DV_T = { viv: 'Vivienda nueva', loc: 'Local comercial nuevo', old: 'Vivienda o local no nuevo, o lote' };
  var DV_K = ['viv', 'loc', 'old'];
  function dvCalc() {

  var AL_PLANS = { pp: ['Persona Plus', 5], em: ['Emprendedor', 15], ep: ['Empresa', 49], pr: ['Empresa Pro', 149] };

  }
  function alActive() { return s.al.clients.filter(function (c) { return c.st === 'act'; }); }

      }).join('') + '</div></div>';

    if (view === 'gan') {
      var rows = [], tot6 = 0;
